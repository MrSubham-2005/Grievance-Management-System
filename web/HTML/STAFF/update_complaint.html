<!DOCTYPE html>

                            <div class="dropdown-body">

                                <div class="info-item">

                                </div>

                                <div class="info-item">
                                    <i class="fa-solid fa-phone"></i>
                                    <span id="staffMobile"></span>
                                </div>

                                <div class="info-item">
                                    <i class="fa-solid fa-envelope"></i>
                                    <span id="staffEmail"></span>
                                </div>

                                <div class="info-item">
                                    <i class="fa-solid fa-star"></i>
                                    <span id="staffRating"></span>
                                </div>

                            <hr class="dropdown-divider">

                            <ul class="dropdown-menu-links">

                                        <i class="fa-solid fa-lock"></i>

            <main class="main-content">

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <div>
                        <h2>Update Complaint Status</h2>
                        <p style="color: var(--text-muted); font-size: 0.9rem;">
                            Select a complaint and update its status.
                        </p>
                    </div>
                </div>

                <div class="form-container">

                    <div id="updateFeedback" class="form-feedback" role="status" aria-live="polite" hidden></div>

                    <form id="updateForm" method="POST" novalidate>

                        <div class="form-group">
                            <label class="form-label" for="complaintId">Select Complaint ID</label>
                            <select name="complaint-id" id="complaintId" class="form-control" required data-error="complaintIdError">
                                <option value="" disabled selected>-- Select Complaint --</option>
                            </select>
                            <div id="complaintIdError" class="error-msg">Please select an eligible complaint ID.</div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="category">Category</label>
                            <input type="text" name="category" id="category" readonly class="form-control field-readonly">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="description">Detailed Description</label>
                            <input type="text" name="description" id="description" readonly class="form-control field-readonly">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="status">Status</label>
                            <input type="text" name="complaint-status" id="status" readonly class="form-control field-readonly">
                        </div>

                        <!-- BUTTONS -->
                        <div style="margin-top: 2rem; display: flex; gap: 1rem;">

                            <a href="staff_dashboard.html" class="btn btn-deactivate" style="text-decoration: none;">
                                Cancel
                            </a>

                            <button type="submit" id="submitBtn" class="btn btn-assign">
                                <i class="fa-solid fa-user-check"></i> Update Complaint
                            </button>

                        </div>

                    </form>

                </div>

            </main>

        </div>
            
        <script src="/gms-api.js"></script>
        <script>

            document.addEventListener("DOMContentLoaded", function () {

                // ======================================
                // Profile Dropdown
                // ======================================

                const profile = document.getElementById("profileTrigger");
                const dropdown = document.getElementById("profileDropdown");

                if(profile && dropdown){

                    profile.addEventListener("click", function(e){

                        e.stopPropagation();

                        profile.classList.toggle("active");
                        dropdown.classList.toggle("show");

                    });

                    document.addEventListener("click", function(e){

                        if(!profile.contains(e.target) &&
                        !dropdown.contains(e.target)){

                            profile.classList.remove("active");
                            dropdown.classList.remove("show");

                        }

                    });

                }

                // ======================================
                // Load Staff Profile
                // ======================================

                fetch("/api/staff/profile", { credentials: "same-origin", cache: "no-store" })
                .then(res => res.json())
                .then(data => {

                    if(data.error){
                        return;
                    }

                    document.getElementById("staffName").textContent =
                        data.staffName;

                    document.getElementById("staffDepartment").textContent =
                        data.department;

                    document.getElementById("staffMobile").textContent =
                        data.mobile;

                    document.getElementById("staffEmail").innerHTML =
                        data.email.replace("@","@<wbr>");

                    document.getElementById("staffRating").textContent =
                        data.rating + " / 5";

                })
                .catch(error => {
                    console.error(error);
                });

                // ======================================
                // Update Complaint Form & Selection
                // ======================================

                const updateForm = document.getElementById("updateForm");
                const complaintSelect = document.getElementById("complaintId");
                const categoryInput = document.getElementById("category");
                const descriptionInput = document.getElementById("description");
                const statusInput = document.getElementById("status");
                const updateFeedback = document.getElementById("updateFeedback");
                const submitBtn = document.getElementById("submitBtn");

                let eligibleComplaints = [];
                let selectedComplaint = null;
                let isSubmitting = false;

                function normalizeStatus(value) {
                    return String(value || "").trim().toLowerCase();
                }

                // Sync aria-invalid and aria-describedby with :user-invalid on interaction only.
                const flaggedControls = new WeakSet();
                function linkControlError(el, shown) {
                    const errorId = el.dataset.error;
                    if (!errorId) return;
                    const ids = (el.getAttribute("aria-describedby") || "")
                        .split(/\s+/)
                        .filter(function (id) { return id && id !== errorId; });
                    if (shown) ids.push(errorId);
                    if (ids.length) el.setAttribute("aria-describedby", ids.join(" "));
                    else el.removeAttribute("aria-describedby");
                }

                function syncControlAria(el) {
                    if (!el || !el.matches || !el.matches("select")) return;
                    const isInvalid = typeof CSS !== "undefined" && CSS.supports && CSS.supports("selector(:user-invalid)")
                        ? el.matches(":user-invalid")
                        : el.classList.contains("user-invalid-fallback");
                    if (isInvalid) {
                        el.setAttribute("aria-invalid", "true");
                        linkControlError(el, true);
                        flaggedControls.add(el);
                    } else if (flaggedControls.has(el) || el.getAttribute("aria-invalid") !== "true") {
                        el.setAttribute("aria-invalid", "false");
                        linkControlError(el, false);
                        flaggedControls.delete(el);
                    }
                }

                function resetSelectValidation(el) {
                    if (!el) return;
                    el.classList.remove("user-invalid-fallback");
                    el.setAttribute("aria-invalid", "false");
                    linkControlError(el, false);
                    flaggedControls.delete(el);
                }

                complaintSelect.setAttribute("aria-invalid", "false");
                complaintSelect.addEventListener("blur", function () { syncControlAria(complaintSelect); });
                complaintSelect.addEventListener("change", function () {
                    if (complaintSelect.value) complaintSelect.classList.remove("user-invalid-fallback");
                    syncControlAria(complaintSelect);
                });

                function showFeedback(message, kind) {
                    if (!message) {
                        updateFeedback.hidden = true;
                        updateFeedback.className = "form-feedback";
                        updateFeedback.innerHTML = "";
                        return;
                    }
                    const variant = kind === "info"
                        ? "form-feedback--info"
                        : "form-feedback--error";
                    const iconClass = kind === "info"
                        ? "fa-circle-info"
                        : "fa-circle-exclamation";
                    updateFeedback.className = "form-feedback " + variant;
                    updateFeedback.setAttribute("role", kind === "info" ? "status" : "alert");
                    updateFeedback.innerHTML = "";
                    const icon = document.createElement("i");
                    icon.className = "fa-solid " + iconClass;
                    icon.setAttribute("aria-hidden", "true");
                    const text = document.createElement("span");
                    text.textContent = message;
                    updateFeedback.appendChild(icon);
                    updateFeedback.appendChild(text);
                    updateFeedback.hidden = false;
                }

                function clearSelectionDetails() {
                    selectedComplaint = null;
                    categoryInput.value = "";
                    descriptionInput.value = "";
                    statusInput.value = "";
                    submitBtn.disabled = eligibleComplaints.length === 0 || isSubmitting;
                }

                async function refreshComplaintsDropdown() {
                    try {
                        const res = await fetch("/api/staff/complaints", {
                            credentials: "same-origin",
                            cache: "no-store",
                        });
                        const data = await res.json();
                        if (!res.ok || data.error) {
                            throw new Error(data.error || "Unable to load complaints.");
                        }

                        const all = data.complaints || [];
                        eligibleComplaints = Array.isArray(data.selectableComplaints)
                            ? data.selectableComplaints
                            : all.filter(function (c) {
                                const key = normalizeStatus(c.status);
                                return key === "assigned" || key === "in progress";
                            });

                        complaintSelect.innerHTML = "";
                        const placeholder = document.createElement("option");
                        placeholder.value = "";
                        placeholder.disabled = true;
                        placeholder.selected = true;
                        placeholder.textContent = eligibleComplaints.length > 0
                            ? "-- Select Complaint --"
                            : "-- No Eligible Complaints Available --";
                        complaintSelect.appendChild(placeholder);

                        if (eligibleComplaints.length > 0) {
                            eligibleComplaints.forEach(function (c) {
                                const opt = document.createElement("option");
                                opt.value = c.complaintId;
                                opt.textContent = c.complaintId;
                                complaintSelect.appendChild(opt);
                            });
                            complaintSelect.disabled = false;
                        } else {
                            complaintSelect.disabled = true;
                        }

                        clearSelectionDetails();
                        resetSelectValidation(complaintSelect);
                    } catch (error) {
                        console.error(error);
                        eligibleComplaints = [];
                        showFeedback(error.message || "Unable to load complaints.", "error");
                        clearSelectionDetails();
                    }
                }

                complaintSelect.addEventListener("change", function () {
                    const id = this.value;
                    showFeedback("");
                    clearSelectionDetails();

                    if (!id) {
                        return;
                    }

                    const complaint = eligibleComplaints.find(function (c) {
                        return c.complaintId === id;
                    });
                    if (!complaint) {
                        showFeedback("Selected complaint could not be found.", "error");
                        submitBtn.disabled = true;
                        return;
                    }

                    categoryInput.value = complaint.category || "";
                    descriptionInput.value = complaint.description || "";

                    const currentKey = normalizeStatus(complaint.status);
                    if (currentKey === "assigned") {
                        statusInput.value = "In Progress";
                        selectedComplaint = complaint;
                        submitBtn.disabled = isSubmitting;
                    } else if (currentKey === "in progress") {
                        statusInput.value = "Resolved";
                        selectedComplaint = complaint;
                        submitBtn.disabled = isSubmitting;
                    } else {
                        statusInput.value = "";
                        selectedComplaint = null;
                        submitBtn.disabled = true;
                        showFeedback("Resolved or ineligible complaints cannot be updated.", "info");
                    }
                });

                updateForm.addEventListener("submit", async function (e) {
                    e.preventDefault();

                    const id = complaintSelect.value;
                    if (!id) {
                        complaintSelect.classList.add("user-invalid-fallback");
                        syncControlAria(complaintSelect);
                        complaintSelect.focus();
                        return;
                    }

                    const newStatus = statusInput.value;
                    if (!selectedComplaint || !newStatus || isSubmitting) {
                        return;
                    }

                    let redirected = false;
                    isSubmitting = true;
                    submitBtn.disabled = true;

                    try {
                        await GMS.post(
                            "/api/staff/complaints/" + encodeURIComponent(id) + "/status",
                            {
                                "complaint-id": id,
                                "complaint-status": newStatus,
                                status: newStatus,
                                expectedStatus: selectedComplaint.status,
                            }
                        );
                        redirected = true;
                        alert("Complaint Status Updated Successfully");
                        window.location.href = "staff_dashboard.html";
                    } catch (error) {
                        showFeedback(error.message || "Unable to update complaint status.", "error");
                        await refreshComplaintsDropdown();
                    } finally {
                        if (!redirected) {
                            isSubmitting = false;
                            submitBtn.disabled = eligibleComplaints.length === 0;
                        }
                    }
                });

                refreshComplaintsDropdown();

            });

        </script>

    </body>

</html>
