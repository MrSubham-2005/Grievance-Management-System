<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Change Password - GMS Admin</title>

        <link rel="stylesheet" href="../../CSS/style.css">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>

    <body>

        <div class="admin-container">

            <aside class="sidebar">
                <div class="sidebar-brand">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>GMS Admin</span>
                </div>

                <ul class="sidebar-menu">
                    <li class="sidebar-item">
                        <a href="admin_dashboard.html">
                            <i class="fa-solid fa-chart-pie"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>

                    <li class="sidebar-item">
                        <a href="view_complaints.html">
                            <i class="fa-solid fa-list-check"></i>
                            <span>View Complaints</span>
                        </a>
                    </li>

                    <li class="sidebar-item">
                        <a href="assign_complaint.html">
                            <i class="fa-solid fa-user-check"></i>
                            <span>Assign Complaint</span>
                        </a>
                    </li>

                    <li class="sidebar-item">
                        <a href="students.html">
                            <i class="fa-solid fa-graduation-cap"></i>
                            <span>Students</span>
                        </a>
                    </li>

                    <li class="sidebar-item">
                        <a href="staff.html">
                            <i class="fa-solid fa-user-tie"></i>
                            <span>Staff</span>
                        </a>
                    </li>
                </ul>
            </aside>

            <nav class="navbar">

                <div class="navbar-title">
                    <h2>Admin Panel</h2>
                </div>

                <div class="navbar-right">

                    <div class="navbar-search">
                        <input type="text" id="adminSearchInput" placeholder="Search complaints, students...">
                    </div>

                    <div class="navbar-profile-container">

                        <div class="navbar-profile" id="profileTrigger">
                            <i class="fa-solid fa-circle-user profile-icon"></i>
                            <i class="fa-solid fa-chevron-down dropdown-arrow"></i>
                        </div>

                        <div class="profile-dropdown" id="profileDropdown">

                            <div class="dropdown-header">
                                <h4 id="adminName"></h4>
                                <span class="dropdown-role">Super Admin</span>
                            </div>

                            <div class="dropdown-body">
                                <div class="info-item">
                                    <i class="fa-solid fa-phone"></i>
                                    <span id="adminMobile"></span>
                                </div>
                                <div class="info-item">
                                    <i class="fa-solid fa-envelope"></i>
                                    <span id="adminEmail"></span>
                                </div>
                            </div>

                            <hr class="dropdown-divider">

                            <ul class="dropdown-menu-links">

                                <li>
                                    <a href="admin_change_password.html">
                                        <i class="fa-solid fa-lock"></i>
                                        <span>Change Password</span>
                                    </a>
                                </li>

                                <li>
                                    <a href="../../Home.html" class="logout-link">
                                        <i class="fa-solid fa-right-from-bracket"></i>
                                        <span>Logout</span>
                                    </a>
                                </li>

                            </ul>

                        </div>

                    </div>

                </div>

            </nav>

            <main class="main-content">

                <div class="password-form-wrapper">

                    <div class="form-container">
                        
                        <div class="form-header-title">
                            <i class="fa-solid fa-key"></i>
                            <span>Security Settings</span>
                        </div>

                        <form id="passwordForm" action="/api/admin/password" method="POST" onsubmit="event.preventDefault(); if (validateFrontendForm()) { GMS.post('/api/admin/password', GMS.formData(this)).then(function (d) { alert(d.message); GMS.go(d.redirect || '/HTML/ADMIN/admin_dashboard.html'); }).catch(function (err) { alert(err.message); }); } return false;">

                            <!-- Current Password -->
                            <div class="form-group">
                                <label class="form-label">Current Password</label>
                                <div class="password-field">
                                    <input type="password" id="admin_current_password" name="admin_current_password" class="form-control" required>
                                    <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('admin_current_password', this)"></i>
                                </div>

                                <span id="currentError" class="error-hint">
                                    <i class="fa-solid fa-circle-exclamation"></i> Current Password is incorrect
                                </span>
                            </div>

                            <!-- New Password -->
                            <div class="form-group">
                                <label class="form-label">New Password</label>
                                <div class="password-field">
                                    <input type="password" id="admin_new_password" name="admin_new_password" class="form-control" required>
                                    <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('admin_new_password', this)"></i>
                                </div>

                                <span id="lenError" class="error-hint">
                                    <i class="fa-solid fa-circle-exclamation"></i> Minimum 6 characters required
                                </span>
                            </div>

                            <!-- Conform Password -->
                            <div class="form-group">
                                <label class="form-label">Conform Password</label>
                                <div class="password-field">
                                    <input type="password" id="admin_conform_password" name="admin_conform_password" class="form-control" required>
                                    <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('admin_conform_password', this)"></i>
                                </div>

                                <span id="matchError" class="error-hint">
                                    <i class="fa-solid fa-circle-exclamation"></i> Passwords do not match
                                </span>
                            </div>

                            <!-- Buttons -->
                            <div class="form-actions-group">
                                <button type="button" class="btn btn-deactivate"
                                    onclick="window.location.href='admin_dashboard.html'">
                                    Cancel
                                </button>

                                <button type="submit" class="btn btn-assign">
                                    Update Password
                                </button>
                            </div>

                        </form>

                    </div>

                </div>

            </main>

        </div>

        <script>

            document.addEventListener("DOMContentLoaded", function () {

                // =====================================
                // Profile Dropdown
                // =====================================

                const profile = document.querySelector(".navbar-profile");
                const dropdown = document.getElementById("profileDropdown");

                profile.addEventListener("click", function(e){

                    e.stopPropagation();
                    profile.classList.toggle("active");
                    dropdown.classList.toggle("show");

                });

                document.addEventListener("click", function(e){

                    if(!profile.contains(e.target) &&
                    !dropdown.contains(e.target)){

                        profile.classList.remove("active");
                        dropdown.classList.remove("show");

                    }

                });


                // =====================================
                // Admin Profile
                // =====================================

                fetch("/api/admin/profile")
                .then(res => res.json())
                .then(data => {

                    document.getElementById("adminName").textContent = data.adminName;
                    document.getElementById("adminMobile").textContent = data.mobile;
                    document.getElementById("adminEmail").innerHTML = data.email.replace("@","@<wbr>");

                });


                // =====================================
                // Hide Error Messages Initially
                // =====================================

                document.getElementById("currentError").style.display = "none";
                document.getElementById("lenError").style.display = "none";
                document.getElementById("matchError").style.display = "none";


                // =====================================
                // Hide Error While Typing
                // =====================================

                document.getElementById("admin_current_password").addEventListener("input", function () {

                    document.getElementById("currentError").style.display = "none";

                });

                document.getElementById("admin_new_password").addEventListener("input", function () {

                    document.getElementById("lenError").style.display = "none";

                });

                document.getElementById("admin_conform_password").addEventListener("input", function () {

                    document.getElementById("matchError").style.display = "none";

                });


                // =====================================
                // Success / Error Popup
                // =====================================

                const params = new URLSearchParams(window.location.search);

                const success = params.get("success");
                const error = params.get("error");

                if(success){

                    alert(success);

                }

                if(error){

                    if(error === "Current Password Incorrect"){

                        document.getElementById("currentError").style.display = "block";

                    }else if(error === "Passwords Do Not Match"){

                        document.getElementById("matchError").style.display="block";

                    }else{

                        alert(error);

                    }

                }
                
                window.history.replaceState({}, document.title, window.location.pathname);

            });


            // =====================================
            // Show / Hide Password
            // =====================================

            function togglePassword(fieldId, icon){

                const field = document.getElementById(fieldId);

                if(field.type==="password"){

                    field.type="text";
                    icon.classList.remove("fa-eye");
                    icon.classList.add("fa-eye-slash");

                }else{

                    field.type="password";
                    icon.classList.remove("fa-eye-slash");
                    icon.classList.add("fa-eye");

                }

            }


            // =====================================
            // Frontend Validation
            // =====================================

            function validateFrontendForm(){

                const current =
                    document.getElementById("admin_current_password")
                    .value.trim();

                const password =
                    document.getElementById("admin_new_password")
                    .value.trim();

                const conform =
                    document.getElementById("admin_conform_password")
                    .value.trim();


                // Current Password

                if(current===""){

                    alert("Current Password is required.");
                    return false;

                }


                // New Password Length

                if(password.length < 6){

                    document.getElementById("lenError").style.display="block";
                    return false;

                }


                // conform Password

                if(password !== conform){

                    document.getElementById("matchError").style.display="block";
                    return false;

                }


                // Same Password Check

                if(current === password){

                    alert("New Password cannot be the same as Current Password.");
                    return false;

                }

                return true;

            }

        </script>

    <script src="/gms-api.js"></script>
    </body>
    
</html>
