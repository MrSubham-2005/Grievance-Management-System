<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Admin Forgot Password - Grievance Management System</title>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <link rel="stylesheet" href="../../CSS/admin_login.css">
    </head>

    <body>

        <main class="login-wrapper">
            
            <div class="login-container">
                <section class="welcome-banner-section">

                    <div class="bg-shape shape-1"></div>
                    <div class="bg-shape shape-2"></div>
                    <div class="bg-shape shape-3"></div>

                    <div class="welcome-content-wrapper">

                        <div class="welcome-top-content">

                            <div class="welcome-hero-icon">
                                <i class="fa-solid fa-user-shield"></i>
                            </div>

                            <h2>Welcome Back!</h2>

                            <p class="welcome-desc">
                                Login to your Grievance Management System and efficiently
                                manage students, staff members, complaints,
                                assign grievances, and monitor the overall system.
                            </p>

                            <p class="signup-alt-text">
                                Remember your password?
                            </p>

                            <a href="admin_login.html" class="btn-signup-outline">
                                Go to Login
                            </a>

                        </div>

                    </div>

                </section>

                <section class="login-form-section">

                    <header class="form-header">

                        <h1>Forgot Password</h1>

                        <p class="subtitle">
                            Enter your email address to reset your password.
                        </p>

                    </header>

                    <form id="gmsLoginForm" action="/api/auth/admin/reset-password" method="POST" novalidate>

                        <div class="input-field-group">

                            <div class="input-control-wrapper">
                                <i class="fa-solid fa-user input-icon"></i>
                                <input type="text" id="adminForgotEmail" name="adminEmail"placeholder=" "required>
                                <label for="adminForgotEmail" class="floating-label"> Email ID </label>
                            </div>
                            <span class="validation-msg" id="emailError"></span>

                        </div>

                        <div class="form-group">

                            <select id="adminSecurityQuestion" name="securityQuestion" class="form-control" required>

                                <option value="" disabled selected>-- Select Security Question --</option>

                                <option>What is your favourite color?</option>
                                <option>What is your pet's name?</option>
                                <option>What is your favourite food?</option>
                                <option>What is your favourite teacher's name?</option>
                                <option>What is your birthplace?</option>

                            </select>
                            <span id="securityQuestionError" class="validation-msg"></span>

                        </div>

                        <div class="input-field-group">

                            <div class="input-control-wrapper">
                                <i class="fa-solid fa-circle-question input-icon"></i>
                                <input type="text" id="adminSecurityAnswer" name="securityAnswer" placeholder=" " required>
                                <label for="adminSecurityAnswer" class="floating-label"> Security Answer </label>
                            </div>
                            <span class="validation-msg" id="securityAnswerError"></span>

                        </div>

                        <div class="input-field-group">

                            <div class="input-control-wrapper">
                                <i class="fa-solid fa-lock input-icon"></i>
                                <input type="text" id="adminPassword" name="adminPassword" placeholder=" " readonly>
                                <label for="adminPassword" class="floating-label"> Your Password </label>

                                <button type="button" id="copyPassword" class="btn-toggle-password" title="Copy Password">
                                    <i class="fa-regular fa-copy"></i>
                                </button>
                            </div>
                            <span class="validation-msg" id="PasswordError"></span>

                        </div>

                        <button type="submit" class="btn-login">
                            Submit
                        </button>

                    </form>

                </section>

            </div>

        </main>

        <script>

            const form = document.getElementById("gmsLoginForm");

            const email = document.getElementById("adminForgotEmail");
            const question = document.getElementById("adminSecurityQuestion");
            const answer = document.getElementById("adminSecurityAnswer");

            const passwordField = document.getElementById("adminPassword");
            const passwordGroup = passwordField.closest(".input-field-group");

            const emailError = document.getElementById("emailError");
            const questionError = document.getElementById("securityQuestionError");
            const answerError = document.getElementById("securityAnswerError");

            // =====================================
            // Hide Password Field Initially
            // =====================================

            passwordGroup.style.display = "none";

            // =====================================
            // Copy Password
            // =====================================

            document.getElementById("copyPassword").addEventListener("click", function(){

                if(passwordField.value.trim()==""){
                    alert("No password available.");
                    return;
                }

                navigator.clipboard.writeText(passwordField.value);

                this.innerHTML='<i class="fa-solid fa-check"></i>';

                setTimeout(()=>{
                    this.innerHTML='<i class="fa-regular fa-copy"></i>';
                },1500);

            });

            // =====================================
            // Gmail Validation
            // =====================================

            function isValidEmail(emailAddress){

                return /^[a-z0-9._%+-]+@gmail\.com$/.test(emailAddress);

            }

            // =====================================
            // Remove Spaces
            // =====================================

            email.addEventListener("input",function(){

                emailError.innerHTML="";
                this.value=this.value.replace(/\s/g,"").toLowerCase();

            });

            question.addEventListener("change", function(){

                questionError.innerHTML="";

            });

            answer.addEventListener("input",function(){

                answerError.innerHTML="";
                this.value=this.value.replace(/\s+/g," ");

            });

            // =====================================
            // Frontend Validation
            // =====================================

            form.addEventListener("submit",function(e){

                e.preventDefault();

                emailError.innerHTML="";
                questionError.innerHTML="";
                answerError.innerHTML="";

                let valid=true;

                if(email.value.trim()==""){

                    emailError.innerHTML='<i class="fa-solid fa-circle-exclamation"></i> Email is required.';
                    valid=false;

                }
                else if(!isValidEmail(email.value.trim())){

                    emailError.innerHTML='<i class="fa-solid fa-circle-exclamation"></i> Enter a valid Gmail address.';
                    valid=false;

                }

                if(question.value==""){

                    questionError.innerHTML='<i class="fa-solid fa-circle-exclamation"></i> Select a security question.';
                    valid=false;

                }

                if(answer.value.trim()==""){

                    answerError.innerHTML='<i class="fa-solid fa-circle-exclamation"></i> Enter your security answer.';
                    valid=false;

                }

                if(valid){

                    GMS.post("/api/auth/admin/reset-password", GMS.formData(form)).then(function (d) { document.getElementById("adminPassword").value = d.password; alert(d.message); }).catch(function (err) { alert(err.message); });

                }

            });

            // =====================================
            // Success / Error Popup
            // =====================================

            const params = new URLSearchParams(window.location.search);

            const error = params.get("error");
            const password = params.get("password");

            if (error) {

                if (error === "Email Not Found") {

                    alert("Email not found.");

                }
                else if (error === "Invalid Security Question or Answer") {

                    alert("Invalid Security Question or Answer.");

                }
                else {

                    alert(error);

                }

            }

            if (password) {

                // Change Header
                document.querySelector(".form-header h1").textContent = "Your Password";
                document.querySelector(".subtitle").textContent =
                    "Your password has been retrieved successfully.";

                // Remove Current Focus
                email.blur();
                answer.blur();
                question.blur();

                // Prevent Mouse Click
                email.style.pointerEvents = "none";
                answer.style.pointerEvents = "none";
                question.style.pointerEvents = "none";

                // Hide Submit Button
                document.querySelector(".btn-login").style.display = "none";

                // Show Password Field
                passwordGroup.style.display = "block";
                passwordGroup.classList.add("password-success");
                passwordField.value = password;

                // Focus Password Field
                passwordField.focus();

            }

            window.history.replaceState({}, document.title, window.location.pathname);

        </script>

    <script src="/gms-api.js"></script>
    </body>

</html>
