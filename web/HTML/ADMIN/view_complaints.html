<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>View Complaints - GMS</title>

        <link rel="stylesheet" href="../../CSS/style.css">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>

    <body>

        <div class="admin-container">

            <aside class="sidebar">
                <div class="sidebar-brand">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>GMS Admin</span>
                </div>

                <ul class="sidebar-menu">
                    <li class="sidebar-item">
                        <a href="admin_dashboard.html">
                            <i class="fa-solid fa-chart-pie"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>

                    <li class="sidebar-item active">
                        <a href="view_complaints.html">
                            <i class="fa-solid fa-list-check"></i>
                            <span>View Complaints</span>
                        </a>
                    </li>

                    <li class="sidebar-item">
                        <a href="assign_complaint.html">
                            <i class="fa-solid fa-user-check"></i>
                            <span>Assign Complaint</span>
                        </a>
                    </li>

                    <li class="sidebar-item">
                        <a href="students.html">
                            <i class="fa-solid fa-graduation-cap"></i>
                            <span>Students</span>
                        </a>
                    </li>

                    <li class="sidebar-item">
                        <a href="staff.html">
                            <i class="fa-solid fa-user-tie"></i>
                            <span>Staff</span>
                        </a>
                    </li>
                </ul>
            </aside>

            <nav class="navbar">

                <div class="navbar-title">
                    <h2>Admin Panel</h2>
                </div>

                <div class="navbar-right">

                    <div class="navbar-search">
                        <input type="text" id="adminSearchInput" placeholder="Search complaints, students...">
                    </div>

                    <div class="navbar-profile-container">

                        <div class="navbar-profile" id="profileTrigger">
                            <i class="fa-solid fa-circle-user profile-icon"></i>
                            <i class="fa-solid fa-chevron-down dropdown-arrow"></i>
                        </div>

                        <div class="profile-dropdown" id="profileDropdown">

                            <div class="dropdown-header">
                                <h4 id="adminName"></h4>
                                <span class="dropdown-role">Super Admin</span>
                            </div>

                            <div class="dropdown-body">
                                <div class="info-item">
                                    <i class="fa-solid fa-phone"></i>
                                    <span id="adminMobile"></span>
                                </div>
                                <div class="info-item">
                                    <i class="fa-solid fa-envelope"></i>
                                    <span id="adminEmail"></span>
                                </div>
                            </div>

                            <hr class="dropdown-divider">

                            <ul class="dropdown-menu-links">

                                <li>
                                    <a href="admin_change_password.html">
                                        <i class="fa-solid fa-lock"></i>
                                        <span>Change Password</span>
                                    </a>
                                </li>

                                <li>
                                    <a href="../../Home.html" class="logout-link">
                                        <i class="fa-solid fa-right-from-bracket"></i>
                                        <span>Logout</span>
                                    </a>
                                </li>

                            </ul>

                        </div>

                    </div>

                </div>

            </nav>

            <main class="main-content">

                <!-- HEADER -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <div>
                        <h2>All Complaints</h2>
                        <p style="color: var(--text-muted); font-size: 0.9rem;">
                            View and manage all student complaints.
                        </p>
                    </div>

                    <!-- LOAD BUTTON -->
                    <div style="display:flex; gap:0.6rem; flex-wrap:wrap;">
                        <button type="button" id="loadDataBtn" class="btn btn-assign">
                            <i class="fa-solid fa-rotate"></i> Load Data
                        </button>
                        <a href="/api/admin/complaints.csv" class="btn btn-assign" download>
                            <i class="fa-solid fa-file-csv"></i> Export CSV
                        </a>
                    </div>
                </div>

                <!-- TABLE -->
                <div class="table-container">

                    <table id="complaintTable" class="custom-table">
                        <thead>
                            <tr>
                                <th>Complaint ID</th>
                                <th>Student</th>
                                <th>Category</th>
                                <th>Description</th>
                                <th>Supported By</th>
                                <th>Staff</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="allComplaints">

                        </tbody>

                    </table>

                </div>

                <div class="pagination">

                    <button id="prevBtn" class="btn btn-prev">
                        << Prev
                    </button>

                    <span id="pageInfo"></span>

                    <button id="nextBtn" class="btn btn-next">
                        Next >>
                    </button>

                </div>

            </main>

        </div>
        <script src="/gms-date.js"></script>
        <script src="/gms-tooltip.js"></script>
        <script>
            document.addEventListener("DOMContentLoaded",()=>{

                // =====================================
                // Pagination Variables
                // =====================================

                let allComplaints = [];
                let originalComplaints = [];
                let currentPage = 1;
                const rowsPerPage = 6;

                // ============================
                // Profile Dropdown
                // ============================

                const profile=document.getElementById("profileTrigger");
                const dropdown=document.getElementById("profileDropdown");

                profile.onclick=function(){

                    profile.classList.toggle("active");
                    dropdown.classList.toggle("show");

                };

                document.onclick=function(e){

                    if(!profile.contains(e.target) &&
                    !dropdown.contains(e.target)){

                        profile.classList.remove("active");
                        dropdown.classList.remove("show");

                    }

                };

                // ============================
                // Admin Profile
                // ============================

                fetch("/api/admin/profile")
                .then(res => res.json())
                .then(data => {

                    document.getElementById("adminName").textContent = data.adminName;
                    document.getElementById("adminMobile").textContent = data.mobile;
                    document.getElementById("adminEmail").innerHTML =
                        data.email.replace("@","@<wbr>");

                });

                // =====================================
                // Render Table
                // =====================================

                function wrapText(text, limit) {

                    let words = text.split(" ");
                    let line = "";
                    let result = "";

                    words.forEach(function(word){

                        if((line + word).length > limit){

                            result += line + "<br>";
                            line = word + " ";

                        }else{

                            line += word + " ";

                        }

                    });

                    return result + line;

                }

                function renderTable(){

                    const tbody=document.getElementById("allComplaints");

                    tbody.innerHTML="";

                    const start=(currentPage-1)*rowsPerPage;
                    const end=start+rowsPerPage;

                    const pageData=allComplaints.slice(start,end);

                    if(pageData.length===0){

                        tbody.innerHTML=`

                            <tr>

                                <td colspan="8" style="text-align:center;">

                                    No Complaints Found

                                </td>

                            </tr>

                        `;

                    }else{

                    pageData.forEach(function(c){

                        const esc = GMSTooltip.escapeHtml;
                        let badge="";
                        const description = wrapText(esc(c.description || ""), 50);

                        switch((c.status || "").toLowerCase()){

                            case "pending":
                                badge="badge-pending";
                                break;

                            case "assigned":
                                badge="badge-assigned";
                                break;

                            case "in progress":
                                badge="badge-in-progress";
                                break;

                            case "resolved":
                                badge="badge-resolved";
                                break;

                            default:
                                badge="";
                        }

                        const studentInfoTip = GMSTooltip.renderInfoTip({
                            idPrefix: "raised-tip",
                            ariaLabel: "Complaint raised details for " + c.complaintId,
                            rows: [
                                { label: "Raised On", value: GMSDate.formatDate(c.complaintDate, "Not Available") }
                            ]
                        });

                        const isUnassigned = !c.assignedStaffId || !c.staffName || c.staffName.toLowerCase() === "not assigned";
                        const staffCellHtml = isUnassigned
                            ? "Not Assigned"
                            : `${esc(c.staffName)} ${GMSTooltip.renderInfoTip({
                                idPrefix: "assign-tip",
                                ariaLabel: "Assignment details for " + c.complaintId,
                                rows: [
                                    { label: "Assigned By", value: c.assignedBy || "Not Available" },
                                    { label: "Assigned On", value: GMSDate.formatDate(c.assignedAt, "Not Available") }
                                ]
                            })}`;

                        tbody.innerHTML+=`

                        <tr>

                            <td>${esc(c.complaintId)}</td>

                            <td>

                                ${esc(c.studentName)}

                                ${studentInfoTip}

                            </td>

                            <td>${esc(c.category)}</td>

                            <td>${description}</td>

                            <td>${esc(c.supportedBy)}</td>

                            <td>${staffCellHtml}</td>

                            <td>

                                <span class="badge ${badge}">

                                    ${esc(c.status)}

                                </span>
                                ${c.overdue ? '<span class="badge badge-overdue" style="margin-left:4px;">Overdue</span>' : ""}

                            </td>

                            <td>

                                <div class="btn-group">

                                    <button
                                        type="button"
                                        class="btn btn-delete delete-btn"
                                        data-id="${esc(c.complaintId)}">

                                        <i class="fa-solid fa-trash"></i>
                                        Delete

                                    </button>

                                    <button
                                        type="button"
                                        class="btn btn-assign undo-btn"
                                        data-id="${esc(c.complaintId)}"
                                        style="display:none;">

                                        <i class="fa-solid fa-rotate-left"></i>
                                        Undo

                                    </button>

                                </div>

                            </td>

                        </tr>

                        `;

                    });

                    GMSTooltip.wire(tbody);

                    }

                    let totalPages=Math.ceil(allComplaints.length/rowsPerPage);

                    if(totalPages===0){
                        totalPages=1;
                    }

                    document.getElementById("pageInfo").innerHTML=
                        "Page "+currentPage+" of "+totalPages;

                    document.getElementById("prevBtn").disabled=
                        currentPage===1;

                    document.getElementById("nextBtn").disabled=
                        currentPage===totalPages;

                }

                // =====================================
                // Filter & Load Complaints
                // =====================================

                let lastComplaintsSnapshot = null;
                let isLoadingComplaints = false;

                function applyComplaintFilter(resetPage) {
                    const searchInput = document.getElementById("adminSearchInput");
                    const keyword = searchInput ? searchInput.value.trim().toLowerCase() : "";

                    if (keyword === "") {
                        allComplaints = [...originalComplaints];
                    } else {
                        allComplaints = originalComplaints.filter(function (c) {
                            return (
                                c.complaintId.toLowerCase().includes(keyword) ||
                                c.complaintId.replace(/-/g, "").toLowerCase().includes(keyword) ||
                                c.studentName.toLowerCase().includes(keyword) ||
                                c.category.toLowerCase().includes(keyword) ||
                                c.description.toLowerCase().includes(keyword) ||
                                c.supportedBy.toLowerCase().includes(keyword) ||
                                c.staffName.toLowerCase().includes(keyword) ||
                                c.status.toLowerCase().includes(keyword)
                            );
                        });
                    }

                    const totalPages = Math.max(1, Math.ceil(allComplaints.length / rowsPerPage));
                    currentPage = resetPage ? 1 : Math.min(Math.max(1, currentPage), totalPages);
                    renderTable();
                }

                function loadComplaints(options) {
                    const preserveState = Boolean(options && options.preserveState);
                    if (isLoadingComplaints) return;
                    isLoadingComplaints = true;

                    fetch("/api/admin/complaints", { credentials: "same-origin", cache: "no-store" })

                    .then(response=>{

                        if(!response.ok){
                            throw new Error("Unable to fetch complaints.");
                        }

                        return response.json();

                    })

                    .then(data=>{

                        if(data.error){
                            throw new Error(data.error);
                        }

                        const nextComplaints = data.complaints || [];
                        const snapshot = JSON.stringify(nextComplaints);
                        if (preserveState && snapshot === lastComplaintsSnapshot) {
                            return;
                        }
                        lastComplaintsSnapshot = snapshot;
                        originalComplaints = nextComplaints;
                        applyComplaintFilter(!preserveState);

                    })

                    .catch(error=>{

                        console.error(error);

                        if (!preserveState) {
                            document.getElementById("allComplaints").innerHTML=`

                                <tr>

                                    <td colspan="8" style="text-align:center;color:red;">

                                        Failed to load complaints.

                                    </td>

                                </tr>

                            `;
                        }

                    })
                    .finally(() => {
                        isLoadingComplaints = false;
                    });

                };

                // =====================================
                // Load Data Button
                // =====================================

                const loadBtn = document.getElementById("loadDataBtn");

                if(loadBtn){

                    loadBtn.addEventListener("click",function(){

                        loadBtn.disabled = true;

                        loadBtn.innerHTML =
                            '<i class="fa-solid fa-spinner fa-spin"></i> Loading...';

                        loadComplaints();

                        setTimeout(function(){

                            loadBtn.disabled = false;

                            loadBtn.innerHTML =
                                '<i class="fa-solid fa-rotate"></i> Load Data';

                        },500);

                    });

                }

                // =====================================
                // Delete Complaint with 10s Undo
                // =====================================

                const deleteTimers = {};

                document.addEventListener("click",function(e){

                    // ==========================
                    // Delete
                    // ==========================

                    if(e.target.closest(".delete-btn")){

                        const deleteBtn = e.target.closest(".delete-btn");
                        const group = deleteBtn.parentElement;

                        const undoBtn = group.querySelector(".undo-btn");

                        const complaintId = deleteBtn.dataset.id;

                        deleteBtn.style.display = "none";
                        undoBtn.style.display = "inline-flex";

                        deleteBtn.disabled = true;

                        if(deleteTimers[complaintId]){
                            clearInterval(deleteTimers[complaintId]);
                        }

                        let seconds = 10;

                        undoBtn.innerHTML =
                            `<i class="fa-solid fa-rotate-left"></i> Undo (${seconds})`;

                        deleteTimers[complaintId] = setInterval(function(){

                            seconds--;

                            undoBtn.innerHTML =
                                `<i class="fa-solid fa-rotate-left"></i> Undo (${seconds})`;

                            if(seconds<=0){

                                clearInterval(deleteTimers[complaintId]);

                                delete deleteTimers[complaintId];fetch("/api/admin/complaints/" + encodeURIComponent(complaintId) + "/delete", { method: "POST" })

                                .then(response=>response.json())

                                .then(data=>{

                                    alert(data.message);

                                    delete deleteTimers[complaintId];

                                    loadComplaints({ preserveState: true });

                                })

                                .catch(()=>{

                                    alert("Unable to delete complaint.");

                                    loadComplaints({ preserveState: true });

                                });

                            }

                        },1000);

                    }

                    // ==========================
                    // Undo
                    // ==========================

                    if(e.target.closest(".undo-btn")){

                        const undoBtn = e.target.closest(".undo-btn");
                        const group = undoBtn.parentElement;

                        const deleteBtn = group.querySelector(".delete-btn");

                        const complaintId = undoBtn.dataset.id;

                        clearInterval(deleteTimers[complaintId]);

                        delete deleteTimers[complaintId];

                        undoBtn.style.display = "none";

                        deleteBtn.style.display = "inline-flex";

                        deleteBtn.disabled = false;

                    }

                });

                // =====================================
                // Pagination
                // =====================================

                document.getElementById("nextBtn").addEventListener("click",function(){

                    const totalPages=Math.ceil(allComplaints.length/rowsPerPage);

                    if(currentPage<totalPages){

                        currentPage++;

                        renderTable();

                    }

                });

                document.getElementById("prevBtn").addEventListener("click",function(){

                    if(currentPage>1){

                        currentPage--;

                        renderTable();

                    }

                });

                // =====================================
                // Search Complaints
                // =====================================

                document.getElementById("adminSearchInput")
                .addEventListener("keyup",function(){

                    applyComplaintFilter(true);

                });

                // =====================================
                // Initial Load & Auto Refresh
                // =====================================

                loadComplaints();
                setInterval(function () {
                    loadComplaints({ preserveState: true });
                }, 15000);
                document.addEventListener("visibilitychange", function () {
                    if (!document.hidden) loadComplaints({ preserveState: true });
                });
                window.addEventListener("focus", function () {
                    loadComplaints({ preserveState: true });
                });
                window.addEventListener("pageshow", function (event) {
                    if (event.persisted) loadComplaints({ preserveState: true });
                });

                // =====================================
                // Success / Error Popup
                // =====================================

                const params=new URLSearchParams(window.location.search);

                if(params.has("success")){

                    alert(params.get("success"));

                }

                if(params.has("error")){

                    alert(params.get("error"));

                }

                window.history.replaceState({},document.title,window.location.pathname);

            });

        </script>

    <script src="/gms-api.js"></script>
    </body>

</html>
