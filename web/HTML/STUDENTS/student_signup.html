<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Student Registration - Grievance Management System</title>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <link rel="stylesheet" href="../../CSS/student_staff_login.css">

    </head>

    <body>

        <main class="login-wrapper">

            <div class="login-container">

                <section class="login-form-section">

                    <header class="form-header">
                        <h1>Student Registration</h1>
                        <p class="subtitle">
                            Create your Grievance Management System account.
                        </p>
                    </header>

                    <form id="gmsSignupForm" action="/api/auth/student/signup" method="POST">

                        <div class="input-field-group">

                            <div class="input-control-wrapper">
                                <i class="fa-solid fa-user input-icon"></i>
                                <input type="text" id="studentName" name="studentName" placeholder=" " required>
                                <label for="studentName" class="floating-label">
                                    Full Name
                                </label>
                            </div>
                            <span class="validation-msg" id="nameError"></span>

                        </div>

                        <div class="input-field-group">

                            <div class="input-control-wrapper">
                                <i class="fa-solid fa-phone input-icon"></i>
                                <input type="text" id="studentMobile" name="studentMobile" placeholder=" " required>
                                <label for="studentMobile" class="floating-label">
                                    Mobile Number
                                </label>
                            </div>
                            <span class="validation-msg" id="mobileError"></span>

                        </div>

                        <div class="input-field-group">

                            <div class="input-control-wrapper">
                                <i class="fa-solid fa-envelope input-icon"></i>
                                <input type="text" id="studentEmail" name="studentEmail" placeholder=" " required>
                                <label for="studentEmail" class="floating-label">
                                    Gmail Address
                                </label>
                            </div>
                            <span class="validation-msg" id="emailError"></span>

                        </div>

                        <div class="input-field-group">

                            <div class="input-control-wrapper">
                                <i class="fa-solid fa-lock input-icon"></i>
                                <input type="password" id="studentPassword" name="studentPassword" placeholder=" " required>
                                <label for="studentPassword" class="floating-label">
                                    Password
                                </label>

                                <button type="button" id="togglePassword" class="btn-toggle-password">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                            <span class="validation-msg" id="passwordError"></span>

                        </div>

                        <div class="input-field-group">

                            <div class="input-control-wrapper">
                                <i class="fa-solid fa-lock input-icon"></i>
                                <input type="password" id="studentConformPassword" name="studentConformPassword" placeholder=" " required>
                                <label for="studentConformPassword" class="floating-label">
                                    Conform Password
                                </label>

                                <button type="button" id="togglestudentConformPassword" class="btn-toggle-password">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                            <span class="validation-msg" id="studentConformPasswordError"></span>

                        </div>

                        <div class="form-group">

                            <select id="studentSecurityQuestion" name="securityQuestion" class="form-control" required>

                                <option value="" disabled selected>-- Select Security Question --</option>

                                <option>What is your favourite color?</option>
                                <option>What is your pet's name?</option>
                                <option>What is your favourite food?</option>
                                <option>What is your favourite teacher's name?</option>
                                <option>What is your birthplace?</option>

                            </select>
                            <span id="securityQuestionError" class="error-hint"></span>

                        </div>

                        <div class="input-field-group">

                            <div class="input-control-wrapper">
                                <i class="fa-solid fa-circle-question input-icon"></i>
                                <input type="text" id="studentSecurityAnswer" name="securityAnswer" placeholder=" " required>
                                <label for="studentSecurityAnswer" class="floating-label"> Security Answer </label>
                            </div>
                            <span class="validation-msg" id="securityAnswerError"></span>

                        </div>

                        <button type="submit" class="btn-login">
                            Register
                        </button>

                    </form>

                </section>

                <section class="signup-welcome-banner-section">

                    <div class="bg-shape shape-1"></div>
                    <div class="bg-shape shape-2"></div>
                    <div class="bg-shape shape-3"></div>

                    <div class="signup-welcome-content-wrapper">

                        <div class="welcome-top-content">

                            <div class="welcome-hero-icon">
                                <i class="fa-solid fa-user-plus"></i>
                            </div>

                            <h2>Join Us!</h2>

                            <p class="welcome-desc">
                                Create your Student Account to raise grievances,
                                track complaint status, receive updates,
                                and communicate with staff.
                            </p>

                            <p class="signup-alt-text">
                                Already have an account?
                            </p>

                            <a href="student_login.html" class="btn-signup-outline">
                                Sign In
                            </a>

                        </div>

                    </div>

                </section>

            </div>

        </main>

        <script src="/gms-api.js"></script>
    <script>

            const form = document.getElementById("gmsSignupForm");

            const nameInput = document.getElementById("studentName");
            const mobileInput = document.getElementById("studentMobile");
            const emailInput = document.getElementById("studentEmail");
            const passwordInput = document.getElementById("studentPassword");
            const studentConformPasswordInput = document.getElementById("studentConformPassword");
            const securityQuestion = document.getElementById("studentSecurityQuestion");
            const securityAnswer = document.getElementById("studentSecurityAnswer");

            const nameError = document.getElementById("nameError");
            const mobileError = document.getElementById("mobileError");
            const emailError = document.getElementById("emailError");
            const passwordError = document.getElementById("passwordError");
            const studentConformPasswordError = document.getElementById("studentConformPasswordError");
            const securityQuestionError = document.getElementById("securityQuestionError");
            const securityAnswerError = document.getElementById("securityAnswerError");


            // =====================================
            // Show / Hide Password
            // =====================================

            const togglePassword = document.getElementById("togglePassword");
            const togglestudentConformPassword = document.getElementById("togglestudentConformPassword");

            togglePassword.addEventListener("click", function () {

                const icon = this.querySelector("i");

                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    icon.classList.replace("fa-eye", "fa-eye-slash");
                } else {
                    passwordInput.type = "password";
                    icon.classList.replace("fa-eye-slash", "fa-eye");
                }

            });

            togglestudentConformPassword.addEventListener("click", function () {

                const icon = this.querySelector("i");

                if (studentConformPasswordInput.type === "password") {
                    studentConformPasswordInput.type = "text";
                    icon.classList.replace("fa-eye", "fa-eye-slash");
                } else {
                    studentConformPasswordInput.type = "password";
                    icon.classList.replace("fa-eye-slash", "fa-eye");
                }

            });


            // =====================================
            // Validation Functions
            // =====================================

            function isValidName(name) {

                name = name.trim();
                const words = name.split(/\s+/);

                return words.length >= 2 &&
                    words.length <= 5 &&
                    /^[A-Za-z ]+$/.test(name);

            }

            function isValidIndianMobile(mobile) {

                return /^[6-9]\d{9}$/.test(mobile);

            }

            function isValidEmail(email) {

                return /^[a-z0-9._%+-]+@gmail\.com$/.test(email);

            }


            // =====================================
            // Remove Spaces
            // =====================================

            nameInput.addEventListener("input", function () {

                nameError.innerHTML = "";
                this.value = this.value.replace(/\s+/g, " ");

            });

            mobileInput.addEventListener("input", function () {

                mobileError.innerHTML = "";
                this.value = this.value.replace(/\D/g, "");

            });

            emailInput.addEventListener("input", function () {

                emailError.innerHTML = "";
                this.value = this.value.replace(/\s/g, "").toLowerCase();

            });

            passwordInput.addEventListener("input", function () {

                passwordError.innerHTML = "";
                this.value = this.value.replace(/\s/g, "");

            });

            studentConformPasswordInput.addEventListener("input", function () {

                studentConformPasswordError.innerHTML = "";
                this.value = this.value.replace(/\s/g, "");

            });

            securityQuestion.addEventListener("change", function () {

                securityQuestionError.innerHTML = "";
                securityQuestionError.classList.remove("show");
            });

            securityAnswer.addEventListener("input", function () {

                securityAnswerError.innerHTML = "";
                securityAnswerError.classList.remove("show");
                this.value = this.value.replace(/\s+/g, " ");

            });


            // =====================================
            // Scroll To Error
            // =====================================

            function scrollToError(element){

                element.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

                element.focus();

            }

            // =====================================
            // Form Validation
            // =====================================

            form.addEventListener("submit", function (e) {

                e.preventDefault();

                nameError.innerHTML = "";
                mobileError.innerHTML = "";
                emailError.innerHTML = "";
                passwordError.innerHTML = "";
                studentConformPasswordError.innerHTML = "";
                securityQuestionError.innerHTML = "";
                securityAnswerError.innerHTML = "";

                let valid = true;

                const name = nameInput.value.trim();
                const mobile = mobileInput.value.trim();
                const email = emailInput.value.trim().toLowerCase();
                const password = passwordInput.value.trim();
                const studentConformPassword = studentConformPasswordInput.value.trim();
                const question = securityQuestion.value;
                const answer = securityAnswer.value.trim();

                // Name

                if (name === "") {

                    nameError.innerHTML ='<i class="fa-solid fa-circle-exclamation"></i> Full Name is required.';
                    valid = false;

                } else if (!isValidName(name)) {

                    nameError.innerHTML ='<i class="fa-solid fa-circle-exclamation"></i> Name must contain 2 to 5 words and only letters.';
                    valid = false;

                }

                // Mobile

                if (mobile === "") {

                    mobileError.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Mobile Number is required.';
                    valid = false;

                } else if (!isValidIndianMobile(mobile)) {

                    mobileError.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Enter a valid 10-digit mobile number.';
                    valid = false;

                }

                // Email

                if (email === "") {

                    emailError.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Email is required.';
                    valid = false;

                } else if (!isValidEmail(email)) {

                    emailError.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Enter a valid Gmail address.';
                    valid = false;

                }

                // Password

                if (password === "") {

                    passwordError.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Password is required.';
                    valid = false;

                } else if (password.length < 6) {

                    passwordError.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Password must be at least 6 characters.';
                    valid = false;

                }

                // ConformPassword

                if (studentConformPassword === "") {

                    studentConformPasswordError.innerHTML ='<i class="fa-solid fa-circle-exclamation"></i> Conform Password is required.';
                    valid = false;

                } else if (password !== studentConformPassword) {

                    studentConformPasswordError.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Passwords do not match.';
                    valid = false;

                }

                // Security Question

                if (question === "") {

                    securityQuestionError.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Please select a security question.';
                    valid = false;

                }

                // Security Answer

                if (answer === "") {

                    securityAnswerError.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Security Answer is required.';
                    valid = false;

                }

                // Submit

                if (valid) {

                    GMS.post("/api/auth/student/signup", GMS.formData(form)).then(function (data) {
                        alert("Account created. Sign in with your email and password.");
                        GMS.go(data.redirect);
                    }).catch(function (error) {
                        alert(error.message);
                    });

                } else {

                    if (nameError.innerHTML !== "") {

                        scrollToError(nameInput);

                    } else if (mobileError.innerHTML !== "") {

                        scrollToError(mobileInput);

                    } else if (emailError.innerHTML !== "") {

                        scrollToError(emailInput);

                    } else if (passwordError.innerHTML !== "") {

                        scrollToError(passwordInput);

                    } else if (studentConformPasswordError.innerHTML !== "") {

                        scrollToError(studentConformPasswordInput);

                    } else if (securityQuestionError.innerHTML !== "") {

                        scrollToError(securityQuestion);

                    } else if (securityAnswerError.innerHTML !== "") {

                        scrollToError(securityAnswer);

                    }

                }

            });


            // =====================================
            // Show error or success message from the server response
            // =====================================

            window.onload = function () {

                const params = new URLSearchParams(window.location.search);

                const error = params.get("error");
                const success = params.get("success");

                if (error) {

                    if (error === "Email already registered") {

                        emailError.innerHTML ='<i class="fa-solid fa-circle-exclamation"></i> ' + error;
                        scrollToError(emailInput);

                    } else if (error === "Mobile Number already registered") {

                        mobileError.innerHTML ='<i class="fa-solid fa-circle-exclamation"></i> ' + error;
                        scrollToError(mobileInput);

                    } else {

                        alert(error);

                    }

                }

                if (success) {

                    alert(success);

                }

            };

        </script>

    </body>

</html>
