<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">GMS Complaint Portal</title>
  <desc id="d">Banner for the GMS complaint portal with a gradient background and a summary of its features.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="180" fill="#38bdf8" opacity="0.12"/>
  <circle cx="150" cy="300" r="160" fill="#818cf8" opacity="0.14"/>
  <rect x="80" y="82" width="64" height="64" rx="16" fill="url(#accent)"/>
  <path d="M100 100h24M100 116h18M100 132h24" stroke="#0b1220" stroke-width="5" stroke-linecap="round"/>
  <text x="168" y="130" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#f8fafc">GMS Complaint Portal</text>
  <text x="84" y="196" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">File once. Track every step. Resolve with clear verdicts.</text>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
    <text x="84" y="268" fill="#38bdf8">Student · Staff · Admin</text>
    <text x="84" y="298" fill="#94a3b8">Role-based sign-in and dashboards</text>
    <text x="520" y="268" fill="#818cf8">PostgreSQL + Express 5</text>
    <text x="520" y="298" fill="#94a3b8">Sessions, bcrypt, live 15s refresh</text>
    <text x="900" y="268" fill="#38bdf8">AI verdicts</text>
    <text x="900" y="298" fill="#94a3b8">Issues split and prioritised</text>
  </g>
</svg>
